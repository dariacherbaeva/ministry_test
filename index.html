<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Должность в Министерстве магии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #340f10;
    --text: #efe1d1;
    --line: rgba(239, 225, 209, 0.35);
    --soft: rgba(239, 225, 209, 0.7);
    --hover: rgba(239, 225, 209, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    line-height: 1.45;
    text-transform: lowercase;
  }
  .card {
    width: 100%;
    max-width: 680px;
    border: 1px solid var(--line);
    outline: 1px solid var(--line);
    outline-offset: 6px;
    padding: 44px 40px 40px;
    position: relative;
  }
  .logo {
    display: block;
    margin: 0 auto 22px;
    width: min(260px, 70%);
    height: auto;
  }
  .eyebrow {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--soft);
    margin: 0 0 14px;
  }
  h1 {
    text-align: center;
    font-size: clamp(24px, 5vw, 34px);
    line-height: 1.2;
    margin: 0 0 20px;
    text-wrap: balance;
  }
  h2 {
    font-size: clamp(19px, 3.6vw, 23px);
    line-height: 1.3;
    margin: 0 0 24px;
    text-wrap: pretty;
  }
  p { margin: 0 0 16px; }
  .lead {
    text-align: center;
    color: var(--soft);
    font-size: 15px;
    max-width: 520px;
    margin: 0 auto 30px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--soft);
    margin: 0 0 26px;
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  button {
    font: inherit;
    color: inherit;
    text-transform: lowercase;
    cursor: pointer;
  }
  .btn {
    display: block;
    margin: 0 auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 15px 34px;
    font-size: 14px;
    letter-spacing: 0.12em;
    transition: opacity .15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }
  .btn.ghost:hover { background: var(--hover); opacity: 1; }
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--soft);
    margin-bottom: 10px;
  }
  .bar {
    height: 2px;
    background: var(--line);
    margin-bottom: 30px;
  }
  .bar span {
    display: block;
    height: 100%;
    background: var(--text);
    transition: width .3s ease;
  }
  .answers { display: grid; gap: 10px; }
  .answer {
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    padding: 14px 18px;
    font-size: 15px;
    line-height: 1.4;
    transition: background .15s, border-color .15s;
  }
  .answer:hover, .answer:focus-visible {
    background: var(--hover);
    border-color: var(--text);
    outline: none;
  }
  .back {
    background: none;
    border: none;
    color: var(--soft);
    font-size: 12px;
    letter-spacing: 0.14em;
    padding: 0;
  }
  .back:hover { color: var(--text); }
  .back[hidden] { visibility: hidden; display: inline; }
  .result-title {
    text-align: center;
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.2;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .result-dept {
    text-align: center;
    color: var(--soft);
    font-size: 13px;
    letter-spacing: 0.12em;
    margin: 0 0 28px;
  }
  .result-text { font-size: 16px; margin-bottom: 28px; }
  .also {
    border-top: 1px solid var(--line);
    padding-top: 20px;
    margin-bottom: 30px;
    font-size: 14px;
    color: var(--soft);
  }
  .also ul { margin: 8px 0 0; padding-left: 18px; }
  .also li { margin-bottom: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .actions .btn { margin: 0; }
  .cta {
    text-align: center;
    margin-top: 26px;
    font-size: 14px;
  }
  .cta a { color: var(--text); }
  .stamp {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--soft);
    margin-top: 30px;
  }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 520px) {
    .card { padding: 32px 20px 28px; outline-offset: 4px; }
    .answer { font-size: 14px; padding: 13px 14px; }
  }
</style>
</head>

const DIMS = ["pow","lead","law","fight","creat","mug","trav","intl","myst","exp","paper","care","edu","hum","sly"];
const vec = o => DIMS.map(k => o[k] || 0);
const norm = v => Math.sqrt(v.reduce((s, x) => s + x * x, 0)) || 1;

function rank(answersIdx) {
  const user = new Array(DIMS.length).fill(0);
  answersIdx.forEach((ai, qi) => {
    const add = vec(QUESTIONS[qi].a[ai][1]);
    add.forEach((x, i) => user[i] += x);
  });
  const un = norm(user);
  return POSITIONS.map((p, i) => {
    const pv = vec(p.p);
    const dot = pv.reduce((s, x, k) => s + x * user[k], 0);
    return { i, score: dot / (un * norm(pv)) };
  }).sort((a, b) => b.score - a.score);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render(html) {
  app.innerHTML = `<div class="fade">${html}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showIntro() {
  render(`
    ${crest}
    <p class="eyebrow">тест недели · осенний выпуск 1995</p>
    <h1>Какая должность в Министерстве магии тебе подходит?</h1>
    <p class="lead">Министерство уверяет, что в стране всё спокойно, а вакансий на девяти уровнях почему-то всё больше. Пока редакция ждёт ответа на очередной запрос в пресс-службу, предлагаем читателям помечтать о карьере. Ответь на ${QUESTIONS.length} вопросов и узнай, в каком кабинете тебе самое место.</p>
    <button class="btn" id="start">Пройти тест</button>
  `);
  document.getElementById("start").onclick = () => {
    current = 0;
    picks = [];
    order = QUESTIONS.map(q => shuffle(q.a.map((_, i) => i)));
    showQuestion();
  };
}

function showQuestion() {
  const q = QUESTIONS[current];
  const pct = (current / QUESTIONS.length) * 100;
  render(`
    <div class="progress">
      <button class="back" id="back" ${current === 0 ? "hidden" : ""}>← Назад</button>
      <span>Вопрос ${current + 1} из ${QUESTIONS.length}</span>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <h2>${q.q}</h2>
    <div class="answers">
      ${order[current].map(i => `<button class="answer" data-i="${i}">${q.a[i][0]}</button>`).join("")}
    </div>
  `);
  app.querySelectorAll(".answer").forEach(b => b.onclick = () => {
    picks[current] = +b.dataset.i;
    current++;
    current < QUESTIONS.length ? showQuestion() : showResult();
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { if (current > 0) { current--; showQuestion(); } };
}

function showResult() {
  const r = rank(picks);
  const best = POSITIONS[r[0].i];
  const alt = r.slice(1, 3).map(x => POSITIONS[x.i]);
  const cta = CONFIG.groupLink
    ? `<p class="cta">Хочешь занять эту должность? <a href="${CONFIG.groupLink}" target="_blank" rel="noopener">${CONFIG.groupName || "Заходи в нашу ролевую"}</a></p>`
    : "";
  render(`
    ${crest}
    <p class="eyebrow">ваш результат</p>
    <p class="lead" style="margin-bottom:18px">Звёзды, чайные листья и редакция Witch Weekly сходятся во мнении: тебе подходит должность</p>
    <h1 class="result-title">${best.t}</h1>
    <p class="result-dept">${best.d}</p>
    <div class="divider">✦</div>
    <p class="result-text">${best.x}</p>
    <div class="also">
      Если с этой должностью не сложится, присмотрись к этим:
      <ul>${alt.map(a => `<li>${a.t}</li>`).join("")}</ul>
    </div>
    <div class="actions">
      <button class="btn" id="again">Пройти заново</button>
      <button class="btn ghost" id="copy">Скопировать результат</button>
    </div>
    ${cta}
    <p class="stamp">Witch Weekly · осень 1995<br>Редакция не несёт ответственности за карьерные решения читателей</p>
  `);
  document.getElementById("again").onclick = showIntro;
  document.getElementById("copy").onclick = async (e) => {
    const text = (`Тест Witch Weekly говорит, что мне подходит должность в Министерстве магии: ${best.t} (${best.d}). А какая подходит тебе?` + (CONFIG.groupLink ? ` ${CONFIG.groupLink}` : "") + "\n\nбольше интересного читай здесь: https://vk.ru/riseofaphoenix_pub").toLowerCase();
    try {
      await navigator.clipboard.writeText(text);
      e.target.textContent = "Скопировано";
    } catch {
      e.target.textContent = "Не удалось скопировать";
    }
  };
}

showIntro();
</script>
</body>
</html>
